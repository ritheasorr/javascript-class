<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieFinder</title>
    <script src="../script/api.js"></script>
    <script src="../script/theme-toggle.js"></script>
    <link rel="icon" type="image/png" href="../public/image_k.png">
    <link rel="stylesheet" href="home.css">
    <link rel="stylesheet" href="theme-toggle.css">
</head>

<body onload="defaultHomePage('A')">
    
    <!-- Theme Button -->
    <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
    </button>
    <!-- Search Bar (Top Left) -->
    <div class="top-bar">
        <form onsubmit="event.preventDefault(); searchTitle(document.getElementById('searchInput').value);">
            <input type="text" id="searchInput" placeholder="Search movies...">
        </form>
    </div>
    <div id="searchResults"></div>
</body>
</html>
